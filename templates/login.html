<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام أرشفة نادي فيفا</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --fifa-green: #123826; --fifa-green-hover: #1e563b; --fifa-gold: #c5a059; --fifa-bg: #f8faf9; }
        body { font-family: 'Almarai', sans-serif; background-color: var(--fifa-bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .login-card { background: #ffffff; border-radius: 16px; border: 1px solid #e2e8e5; box-shadow: 0 10px 30px rgba(18, 56, 38, 0.08); width: 100%; max-width: 420px; padding: 2.5rem; position: relative; overflow: hidden; }
        .login-card::before { content: ''; position: absolute; top: 0; right: 0; left: 0; height: 5px; background: linear-gradient(90deg, var(--fifa-green), var(--fifa-gold)); }
        .logo-img { height: 75px; width: auto; object-fit: contain; margin-bottom: 1rem; }
        .form-control { border-radius: 8px; padding: 0.75rem 1rem; border-color: #dbe3df; }
        .form-control:focus { border-color: var(--fifa-gold); box-shadow: 0 0 0 0.25rem rgba(197, 160, 89, 0.2); }
        .btn-fifa { background-color: var(--fifa-green); color: #ffffff; border-radius: 8px; padding: 0.75rem; font-weight: 700; border: none; width: 100%; transition: background 0.2s; }
        .btn-fifa:hover { background-color: var(--fifa-green-hover); color: #ffffff; }
        .link-gold { color: var(--fifa-gold); text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <img src="{{ url_for('static', filename='fifa_logo.png') }}" alt="شعار نادي فيفا" class="logo-img" onerror="this.onerror=null; this.src='https://faifafc.sa/wp-content/uploads/2021/08/logo.png';">
        <h4 class="fw-bold mb-1" style="color: var(--fifa-green);">نادي فيفا الرياضي</h4>
        <p class="text-muted fs-7 mb-4">نظام الأرشفة والخطابات الإلكتروني</p>
        <form action="/" method="post">
            <div class="mb-3 text-start">
                <label class="form-label fw-bold fs-7" style="color: var(--fifa-green);">اسم المستخدم</label>
                <input type="text" name="username" class="form-control" placeholder="أدخل اسم المستخدم" required>
            </div>
            <div class="mb-4 text-start">
                <label class="form-label fw-bold fs-7" style="color: var(--fifa-green);">كلمة المرور</label>
                <input type="password" name="password" class="form-control" placeholder="أدخل كلمة المرور" required>
            </div>
            <button type="submit" class="btn btn-fifa mb-3">تسجيل الدخول</button>
        </form>
        <div class="border-top pt-3 mt-3">
            <span class="text-muted fs-7">ليس لديكم حساب للقسم؟</span>
            <a href="/register" class="link-gold fs-7 ms-1">تسجيل إدارة جديدة</a>
        </div>
    </div>
</body>
</html>
